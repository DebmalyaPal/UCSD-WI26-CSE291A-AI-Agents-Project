services:
  postgres:
    image: postgres:15-alpine
    platform: linux/arm64/v8           # native ARM64 for M1/M2
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    ports:
      - "5432:5432"
    volumes:
      - nakama_data:/var/lib/postgresql/data
    networks:
      - dojo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.15.0
    platform: linux/amd64              # Nakama only available as amd64, runs under emulation
    volumes:
      - ./local.yml:/nakama/data/local.yml
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    networks:
      - dojo-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nakama_data:

networks:
  dojo-network:
    driver: bridge